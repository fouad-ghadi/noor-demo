# Configuration Render (« Blueprint ») : Render lit ce fichier pour créer le service.
# Tableau de bord Render → New → Blueprint → choisir ce dépôt GitHub.
services:
  - type: web
    name: noor-demo
    runtime: docker
    plan: free              # gratuit : veille après 15 min sans visite (évitée avec UptimeRobot, voir docs/DEPLOIEMENT.md)
    region: frankfurt       # la plus proche du Maroc
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true        # chaque « git push » sur main met le site à jour
    branch: main
